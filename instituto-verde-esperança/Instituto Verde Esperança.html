<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instituto Verde Esperança</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --g50:#f0faf3;--g100:#d9f0e1;--g200:#aadbbf;--g500:#259a43;--g600:#1e7d37;--g700:#175f2a;
      --bg:#f6f8f6;--white:#fff;--border:#e3eae4;--text:#0f1a10;--muted:#627065;
      --f:'Plus Jakarta Sans',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{font-family:var(--f);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:1216px;margin:0 auto;padding:0 40px}

    /* ── ANIMATIONS ── */
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-8px)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.92)}}
    @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    @keyframes wave{0%,100%{transform:rotate(0deg) translateX(0)}25%{transform:rotate(8deg) translateX(2px)}75%{transform:rotate(-6deg) translateX(-2px)}}
    @keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(6px,-8px)}66%{transform:translate(-4px,5px)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

    /* ── NAVBAR ── */
    .nav{position:fixed;top:0;left:0;right:0;z-index:300;transition:background .25s,box-shadow .25s}
    .nav.solid{background:var(--white);box-shadow:0 1px 0 var(--border)}
    .nav-inner{display:flex;align-items:center;height:68px;gap:36px}
    .nav-links{display:flex;gap:28px;list-style:none;flex:1}
    .nav-links a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .15s}
    .nav-links a:hover{color:var(--text)}
    .nav-btns{display:flex;gap:8px;align-items:center}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-family:var(--f);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;border:none;line-height:1}
    .btn-primary{background:var(--g500);color:#fff}.btn-primary:hover{background:var(--g600);transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,154,67,.3)}
    .btn-ghost{background:transparent;color:var(--text)}.btn-ghost:hover{background:var(--g50)}
    .btn-outline{background:var(--white);color:var(--text);border:1px solid var(--border)}.btn-outline:hover{border-color:var(--g500);color:var(--g500)}
    .btn-lg{padding:13px 24px;font-size:15px;border-radius:10px}
    .btn-xl{padding:15px 28px;font-size:16px;border-radius:10px}

    /* ── HERO ── */
    .hero-stage{position:relative;overflow:hidden;margin-top:68px}
    .hero-track{display:flex;transition:transform .7s cubic-bezier(.25,.46,.45,.94)}
    .hero-slide{flex-shrink:0;width:100%;min-height:calc(100vh - 68px);display:flex;align-items:center;padding:56px 0 44px;position:relative;overflow:hidden}
    .hero-inner{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;position:relative;z-index:2;width:100%}
    .hero-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:18px;letter-spacing:.3px}
    .chip-green{background:var(--g50);border:1px solid var(--g100);color:var(--g600)}
    .chip-white{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:white}
    .hero-h1{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-2px;margin-bottom:18px}
    .hero-sub{font-size:16px;line-height:1.8;margin-bottom:28px;max-width:490px}
    .hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
    .hero-stats{display:flex;gap:32px;margin-top:36px;padding-top:36px}
    .hstat-val{font-size:22px;font-weight:800;letter-spacing:-.5px}
    .hstat-lbl{font-size:11px;margin-top:1px}

    /* carousel */
    .c-dots{display:flex;gap:8px;justify-content:center;padding:24px 0;position:relative;z-index:3}
    .c-dot{width:8px;height:8px;border-radius:999px;cursor:pointer;transition:all .28s}
    .c-arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.1);transition:all .15s;z-index:10;border:none}
    .c-arr-l{left:24px}.c-arr-r{right:24px}
    .s1{background:var(--white)}.s1 .hero-h1{color:var(--text)}.s1 .hero-sub{color:var(--muted)}.s1 .hero-stats{border-top:1px solid var(--border)}.s1 .hstat-val{color:var(--text)}.s1 .hstat-lbl{color:var(--muted)}.s1 .c-arr{background:var(--white);border:1px solid var(--border);color:var(--muted)}.s1 .c-arr:hover{border-color:var(--g500);color:var(--g500)}.s1 .c-dot{background:rgba(37,154,67,.2)}.s1 .c-dot.on{width:28px;background:var(--g500)}
    .s2{background:var(--g500)}.s2 .hero-h1{color:#fff}.s2 .hero-sub{color:rgba(255,255,255,.85)}.s2 .hero-stats{border-top:1px solid rgba(255,255,255,.2)}.s2 .hstat-val{color:#fff}.s2 .hstat-lbl{color:rgba(255,255,255,.65)}.s2 .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}.s2 .c-arr{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff}.s2 .c-arr:hover{background:rgba(255,255,255,.25)}.s2 .c-dot{background:rgba(255,255,255,.3)}.s2 .c-dot.on{width:28px;background:#fff}
    .s3{background:#fef3e2}.s3 .hero-h1{color:var(--text)}.s3 .hero-sub{color:var(--muted)}.s3 .hero-stats{border-top:1px solid #f0ddb8}.s3 .hstat-val{color:var(--text)}.s3 .hstat-lbl{color:var(--muted)}.s3 .c-arr{background:var(--white);border:1px solid #e8d4a8;color:var(--muted)}.s3 .c-arr:hover{border-color:var(--g500);color:var(--g500)}.s3 .c-dot{background:rgba(37,154,67,.2)}.s3 .c-dot.on{width:28px;background:var(--g500)}

    /* ── STATS BAR ── */
    .statsbar{background:var(--g500);padding:48px 0}
    .statsbar-grid{display:grid;grid-template-columns:repeat(4,1fr)}
    .sitem{text-align:center;padding:0 20px}
    .sitem+.sitem{border-left:1px solid rgba(255,255,255,.18)}
    .snum{font-size:38px;font-weight:800;color:#fff;letter-spacing:-1.5px}
    .snum span{color:rgba(255,255,255,.55)}
    .sdesc{font-size:13px;color:rgba(255,255,255,.65);margin-top:5px;line-height:1.5}

    /* ── SECTIONS ── */
    .sec{padding:96px 0;background:var(--bg)}
    .sec-white{padding:96px 0;background:var(--white)}
    .sec-green{padding:96px 0;background:var(--g50)}
    .sec-dark-green{padding:96px 0;background:var(--g500)}
    .sec-deepgreen{padding:96px 0;background:var(--g700)}
    .sec-lbl{font-size:11px;font-weight:700;color:var(--g500);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
    .sec-lbl-w{font-size:11px;font-weight:700;color:var(--g200);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
    .sec-h2{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.18;margin-bottom:16px}
    .sec-h2-w{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.18;margin-bottom:16px;color:#fff}
    .sec-p{font-size:16px;color:var(--muted);line-height:1.75}
    .sec-p-w{font-size:16px;color:rgba(255,255,255,.7);line-height:1.75}

    /* ── QUEM SOMOS ── */
    .qs-inner{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;margin-bottom:72px}
    .qs-text p{font-size:15px;color:var(--muted);line-height:1.85;margin-bottom:16px}
    .qs-text p:last-child{margin-bottom:0}
    .qs-illus{position:relative;display:flex;align-items:center;justify-content:center}
    .qs-illus-bg{position:absolute;width:260px;height:260px;border-radius:50%;background:var(--g100);opacity:.5;right:-20px;bottom:-20px}
    .qs-illus-card{position:relative;z-index:1;background:white;border-radius:20px;border:1px solid var(--border);box-shadow:0 8px 32px rgba(37,154,67,.1);overflow:hidden;width:100%}
    .qs-feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .qs-feat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px 20px;text-align:center;transition:box-shadow .18s}
    .qs-feat:hover{box-shadow:0 6px 24px rgba(0,0,0,.07)}
    .qs-feat-ico{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px}
    .qs-feat-title{font-size:14px;font-weight:700;margin-bottom:8px}
    .qs-feat-desc{font-size:12px;color:var(--muted);line-height:1.6}
    /* ── PARCEIROS ── */
    .parceiros-track-wrap{overflow:hidden;position:relative;margin-top:52px}
    .parceiros-track-wrap::before,.parceiros-track-wrap::after{content:'';position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
    .parceiros-track-wrap::before{left:0;background:linear-gradient(to right,var(--white),transparent)}
    .parceiros-track-wrap::after{right:0;background:linear-gradient(to left,var(--white),transparent)}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .parceiros-track{display:flex;gap:0;animation:marquee 28s linear infinite;width:max-content}
    .parceiros-track:hover{animation-play-state:paused}
    .parceiro-item{display:flex;align-items:center;justify-content:center;padding:0 40px;flex-shrink:0;height:88px}
    .parceiro-logo{opacity:.55;transition:opacity .2s;filter:grayscale(40%)}
    .parceiro-logo:hover{opacity:1;filter:grayscale(0%)}

    /* ── ESPECIALIDADES ── */
    .esp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:52px}
    .esp-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:26px;transition:all .18s;cursor:default}
    .esp-card:hover{border-color:var(--g200);box-shadow:0 6px 24px rgba(37,154,67,.1);transform:translateY(-2px)}
    .esp-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .esp-name{font-size:15px;font-weight:700;margin-bottom:6px}
    .esp-desc{font-size:13px;color:var(--muted);line-height:1.6}

    /* ── PLATFORM ── */
    .plat-sec{background:#0e1810;padding:104px 0}
    .plat-inner{display:grid;grid-template-columns:1fr 1.5fr;gap:88px;align-items:center}
    .plat-lbl{font-size:11px;font-weight:700;color:var(--g500);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
    .plat-h2{font-size:36px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1.2;margin-bottom:18px}
    .plat-sub{font-size:15px;color:rgba(255,255,255,.5);line-height:1.75;margin-bottom:36px}
    .plat-features{display:flex;flex-direction:column;gap:18px}
    .pfeat{display:flex;gap:14px;align-items:flex-start}
    .pfeat-ico{width:32px;height:32px;border-radius:8px;background:rgba(37,154,67,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .pfeat h4{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
    .pfeat p{font-size:13px;color:rgba(255,255,255,.45);line-height:1.55}
    .dash-prev{background:#131f14;border-radius:16px;border:1px solid rgba(255,255,255,.07);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.4)}
    .dp-head{background:#0b130c;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}
    .dp-breadcrumb{font-size:11px;color:rgba(255,255,255,.35);font-weight:500}.dp-breadcrumb b{color:rgba(255,255,255,.7)}
    .dp-acts{display:flex;gap:6px}
    .dp-act{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
    .dp-layout{display:flex}
    .dp-sidebar{width:168px;background:#0b130c;padding:14px 12px;border-right:1px solid rgba(255,255,255,.05);flex-shrink:0}
    .dp-grp-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:1px;text-transform:uppercase;padding:0 8px;margin-bottom:4px;margin-top:12px}
    .dp-grp-lbl:first-child{margin-top:0}
    .dp-nav-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;margin-bottom:1px;cursor:pointer}
    .dp-nav-item.on{background:rgba(37,154,67,.12)}
    .dp-nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0}
    .dp-nav-item.on .dp-nav-dot{background:var(--g500)}
    .dp-nav-txt{font-size:11px;color:rgba(255,255,255,.3)}
    .dp-nav-item.on .dp-nav-txt{color:rgba(255,255,255,.85);font-weight:500}
    .dp-content{flex:1;padding:16px;overflow:hidden;min-width:0}
    .dp-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .dp-metric{background:#1a2419;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:11px 12px}
    .dp-metric-lbl{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
    .dp-metric-val{font-size:15px;font-weight:700;color:#fff}
    .dp-metric-delta{font-size:9px;color:var(--g500);margin-top:1px;font-weight:500}
    .dp-chart-card{background:#1a2419;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px;margin-bottom:12px}
    .dp-chart-lbl{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
    .dp-list-card{background:#1a2419;border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:12px}
    .dp-list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
    .dp-list-row:last-child{border-bottom:none}
    .dp-lr-name{font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
    .dp-lr-time{font-size:9px;color:rgba(255,255,255,.25)}
    .dp-lr-badge{background:rgba(37,154,67,.2);color:var(--g500);font-size:9px;font-weight:600;padding:2px 8px;border-radius:999px}

    /* ── SOBRE ── */
    .sobre-inner{display:grid;grid-template-columns:1fr 1fr;gap:88px;align-items:start}
    .sobre-text p{font-size:15px;color:var(--muted);line-height:1.85;margin-bottom:18px}
    .sobre-text p:last-child{margin-bottom:0}
    .sobre-highlights{display:flex;flex-direction:column;gap:14px}
    .shigh{padding:20px 22px;background:var(--g50);border-radius:12px;border:1px solid var(--g100)}
    .shigh h4{font-size:14px;font-weight:700;margin-bottom:5px;color:var(--g700)}
    .shigh p{font-size:13px;color:var(--muted);line-height:1.65}

    /* ── DEPOIMENTOS CAROUSEL ── */
    .depo-wrap{max-width:780px;margin:52px auto 0}
    .depo-card-single{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:44px 48px;box-shadow:0 4px 24px rgba(0,0,0,.06);position:relative;animation:scaleIn .3s ease}
    .depo-quote-mark{position:absolute;top:28px;right:36px;font-size:80px;color:var(--g100);font-family:Georgia,serif;line-height:1;pointer-events:none;user-select:none}
    .depo-avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .depo-av-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--g500);overflow:hidden;flex-shrink:0;background:var(--g50);display:flex;align-items:center;justify-content:center;position:relative}
    .depo-verified{position:absolute;bottom:28px;left:68px;width:22px;height:22px;border-radius:50%;background:var(--g500);border:2px solid var(--white);display:flex;align-items:center;justify-content:center}
    .depo-name{font-size:16px;font-weight:700}
    .depo-role{font-size:13px;color:var(--muted);margin-top:2px}
    .depo-text{font-size:16px;color:var(--text);line-height:1.85;font-style:italic}
    .depo-nav{display:flex;gap:8px;justify-content:center;margin-top:28px}
    .depo-dot{width:8px;height:8px;border-radius:999px;background:rgba(37,154,67,.2);cursor:pointer;transition:all .25s}
    .depo-dot.on{width:28px;background:var(--g500)}
    .depo-count{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
    .depo-count strong{color:var(--g600)}

    /* ── MVV ── */
    .mvv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:52px}
    .mvv-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:28px}
    .mvv-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:10px}
    .mvv-txt{font-size:14px;color:rgba(255,255,255,.72);line-height:1.7}
    .mvv-list{list-style:none;display:flex;flex-direction:column;gap:9px}
    .mvv-list li{font-size:13px;color:rgba(255,255,255,.7);display:flex;align-items:flex-start;gap:8px;line-height:1.55}

    /* ── FAQ ── */
    .faq-wrap{max-width:720px;margin:52px auto 0}
    .faq-item{border-bottom:1px solid var(--border)}
    .faq-q{display:flex;justify-content:space-between;align-items:center;padding:20px 0;cursor:pointer;gap:16px;user-select:none}
    .faq-q-txt{font-size:15px;font-weight:600}
    .faq-chev{flex-shrink:0;color:var(--muted);transition:transform .2s}
    .faq-chev.open{transform:rotate(180deg)}
    .faq-a{font-size:14px;color:var(--muted);line-height:1.75;padding-bottom:20px}

    /* ── DOAÇÕES ── */
    .doa-inner{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
    .doa-text p{font-size:15px;color:rgba(255,255,255,.75);line-height:1.85;margin-bottom:16px}
    .doa-text strong{color:#fff}
    .doa-stats{display:flex;flex-direction:column;gap:14px}
    .doa-stat{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:20px}
    .doa-stat-ico{width:46px;height:46px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .doa-stat-val{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
    .doa-stat-lbl{font-size:12px;color:rgba(255,255,255,.6);margin-top:1px;line-height:1.5}

    /* ── CONTATO ── */
    .ctto-inner{display:grid;grid-template-columns:1fr 1fr;gap:72px}
    .ctto-items{display:flex;flex-direction:column;gap:20px}
    .ctto-item{display:flex;gap:14px;align-items:flex-start}

    </svg>
  );
  if(shape==='badge') return(
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <rect x="1" y="1" width={w-2} height={h-2} rx="24" fill={color} opacity=".1"/>

      <text x={h+8} y={h/2+5} fontSize="13" fontWeight="700" fill={color} fontFamily="Plus Jakarta Sans,sans-serif">{name}</text>

  );
  return(
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <text x={w/2} y={h/2-2} fontSize="11" fontWeight="600" fill={color} textAnchor="middle" fontFamily="Plus Jakarta Sans,sans-serif" opacity=".6">PARCEIRO</text>

    </svg>
  );
}

function HeroCarousel(){
  const [slide,setSlide]=useState(0);
  const [paused,setPaused]=useState(false);
  const stageRef=useRef(null);
  const [w,setW]=useState(0);
  useEffect(()=>{
    const upd=()=>setW(stageRef.current?.offsetWidth||0);
    upd();
    const ro=new ResizeObserver(upd);
    if(stageRef.current)ro.observe(stageRef.current);
    return()=>ro.disconnect();
  },[]);
  useEffect(()=>{
    if(paused)return;
    const t=setInterval(()=>setSlide(s=>(s+1)%SLIDES.length),5800);
    return()=>clearInterval(t);
  },[paused]);
  const go=n=>setSlide((n+SLIDES.length)%SLIDES.length);
  const s=SLIDES[slide];
  const rightEl=r=>{
    if(r==='mockup') return <HeroMockup/>;
    if(r==='therapy') return <div style={{display:'flex',justifyContent:'center',alignItems:'flex-end'}}><IllusTherapy/></div>;

function DoacaoModal({onClose}){
  const [tab,setTab]=useState('pix');

  const [preset,setPreset]=useState(null);
  const [copied,setCopied]=useState(false);
  const [done,setDone]=useState(false);
  const [ccData,setCcData]=useState({num:'',nome:'',exp:'',cvv:''});
  const pix='pix@institutovertdeesperanca.org.br';
  const handlePreset=v=>{setPreset(v);setValor(v.toString());};
  const handleCopy=()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);};

    <div className="modal-ov" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>

        <div className="ptabs">
          <div className={`ptab${tab==='pix'?' on':''}`} onClick={()=>setTab('pix')}><Ic n="qr" s={14}/> PIX</div>

        </div>
        {tab==='pix'&&(
          <div style={{textAlign:'center'}}>
            <div className="qr-box"><Ic n="qr" s={48} c="var(--g500)"/><span style={{fontSize:10,color:'var(--muted)',fontWeight:600}}>QR Code PIX</span></div>
            <p style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>Ou copie a chave PIX:</p>
            <div className="copy-row"><span className="pix-key">{pix}</span><button className="copy-btn" onClick={handleCopy}>{copied?'Copiado!':'Copiar'}</button></div>
            <p style={{fontSize:11,color:'var(--muted)',lineHeight:1.6,marginBottom:16}}>Após o pagamento, envie o comprovante para <strong>doacoes@iverde.org.br</strong>.</p>

            <div className="cc-grid">
              <div className="fgroup cc-full"><label>Número do cartão</label><input placeholder="0000 0000 0000 0000" maxLength={19} value={ccData.num} onChange={e=>setCcData(d=>({...d,num:e.target.value}))}/></div>

              <div className="fgroup"><label>Validade</label><input placeholder="MM/AA" maxLength={5} value={ccData.exp} onChange={e=>setCcData(d=>({...d,exp:e.target.value}))}/></div>
              <div className="fgroup"><label>CVV</label><input placeholder="000" maxLength={4} value={ccData.cvv} onChange={e=>setCcData(d=>({...d,cvv:e.target.value}))}/></div>
            </div>
            <button type="submit" className="btn btn-primary btn-lg" style={{width:'100%',justifyContent:'center'}}>Doar R$ {valor||'—'} <Ic n="heart" s={15}/></button>
          </form>
        )}
        {tab==='boleto'&&(
          <div>
            <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:10,padding:20,marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:4}}>Boleto bancário</div>

              <div className="boleto-code">00190.00009 02600.360320 00001.100006 2 10260000000{(parseFloat(valor)||0).toFixed(2).replace('.','')}</div>
            </div>
            <button className="btn btn-primary btn-lg" style={{width:'100%',justifyContent:'center'}} onClick={()=>setDone(true)}>Gerar boleto <Ic n="receipt" s={15}/></button>
          </div>
        )}
      </div>
    </div>
  );
}

}/*EDITMODE-END*/;
